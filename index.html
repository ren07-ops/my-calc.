<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="Main">
        <div class="CalcMain col">
            <div class="CalcDisplay" id="Display"></div>
            <div class="Buttons">
            <div class="num">
                <div class="row">
                <button class="buttons" >1</button>
                <button class="buttons">2</button>
                <button class="buttons">3</button>
            </div>
             <div class="row">
                <button class="buttons">4</button>
                <button class="buttons">5</button>
                <button class="buttons">6</button>
                </div>
                <div class="row">
                <button class="buttons">7</button>
                <button class="buttons">8</button>
                <button class="buttons">9</button>
                </div>
                </div>
                    <div class="rowf">
                <button class="CalcFunct">+</button>
                <button class="CalcFunct">-</button>
                <button class="CalcFunct">*</button>
                <button class="CalcFunct">/</button>
                <button class="CalcFunct">C</button>
                <button class="CalcFunct">=</button>
               </div>
            </div>
        </div>
    </div>
    <script src="calc.js"></script>
</body>
</html>
